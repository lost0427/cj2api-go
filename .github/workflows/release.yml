name: release
on:
  push:
    tags: ["latest", "v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux, goarch: amd64}
          - {os: ubuntu-latest, goos: linux, goarch: arm64}
          - {os: windows-latest, goos: windows, goarch: amd64}
          - {os: windows-latest, goos: windows, goarch: arm64}
          - {os: macos-latest, goos: darwin, goarch: amd64}
          - {os: macos-latest, goos: darwin, goarch: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="cj2api-go-$GOOS-$GOARCH"
          [ "$GOOS" = windows ] && out="$out.exe"
          go build -trimpath -ldflags="-s -w" -o "dist/$out" .
          (cd dist && (sha256sum "$out" > "$out.sha256" 2>/dev/null || shasum -a 256 "$out" > "$out.sha256"))
      - shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes "" 2>/dev/null \
            || gh release upload "${{ github.ref_name }}" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git tag -f latest
          git push -f origin latest
          gh release create latest dist/* --title latest --notes "" 2>/dev/null \
            || gh release upload latest dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
